name: Publish verified CJ POS test website

on:
  push:
    branches: [site-test-0.1.6]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check reviewed release payload
        run: |
          test -f site/index.html
          test -f site/downloads/CJ_POS_0.1.6_Test.apk
          echo '8074c85820e27da0658663dee2c23647270875cd636b86672b164d9b16b1288b  site/downloads/CJ_POS_0.1.6_Test.apk' | sha256sum --check
          ! test -d site/src
      - uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
