name: Feature request
description: Suggest a specific improvement to CJ POS.
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "Describe the merchant or customer problem first. Do not include real customer or business records."
  - type: textarea
    id: problem
    attributes:
      label: Problem and current workflow
      placeholder: "When I ..., I need ... because ..."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Register / Payments
        - Kitchen / History
        - Menu / Guest ordering
        - Local storage / Backup
        - Android wrapper
        - Other
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Offline or data implications
      description: Explain any effect on local-only data, privacy, payment confirmation or import/export.
